name: release

# On a vX.Y.Z tag, build the container and push it to GHCR as both the version
# tag and `latest`, for linux/amd64 + linux/arm64 — consumers run this image on
# arm64 CI runners, where an amd64-only manifest is an `exec format error`.
#
# Then sign what we ship (keyless GitHub OIDC, Sigstore/Fulcio):
#   1. build-provenance attestation — proves *how* the image was built.
#   2. SBOM attestation — proves *what's in it*, generated by running the
#      just-shipped image against itself, bound to the same digest.
# Both are pushed to the registry as OCI referrers (cosign-verifiable) and
# verified in-workflow so a broken signing step fails the release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write # mint the OIDC token for keyless Sigstore signing
  attestations: write # write attestations to the GitHub attestations API

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # github.repository is mixed-case (NissesSenap/…); GHCR refs must be lowercase.
      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      # Multi-platform needs the docker-container driver — the default `docker`
      # driver refuses it outright. The buildkit image ships its own qemu and
      # registers binfmt on startup, so no setup-qemu-action for the emulated
      # runtime stage.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 1. Provenance: how the image was built. For a multi-platform build the
      #    digest is the manifest index's, so both attestations below bind to the
      #    index — which is what consumers pull by tag.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # 2. SBOM: what's in the image. Run the just-shipped image against itself
      #    (trivy pulls the same digest anonymously — the package is public) —
      #    the bundled tools produce a validated 1.6 SBOM on stdout, logs go to
      #    stderr. The runner is amd64, so trivy resolves the index to the amd64
      #    manifest and the apk purls carry ?arch=x86_64. Bind the attestation to
      #    that child digest rather than the index, so an arm64 consumer is never
      #    handed an SBOM asserting the wrong architecture.
      - name: Generate SBOM for the release image
        id: sbom
        run: |
          ref="${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}"
          amd64="$(docker buildx imagetools inspect "$ref" --raw | jq -er \
            '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')"
          echo "digest=$amd64" >> "$GITHUB_OUTPUT"
          docker run --rm "$ref" --image "$ref" --supplier-name "sbom-quality" \
            > sbom.cdx.json

      - uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.sbom.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      # 3. Smoke check: a broken signing step must fail the release.
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="oci://${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}"
          # default predicate-type is SLSA provenance
          gh attestation verify "$ref" --repo "$GITHUB_REPOSITORY"
          gh attestation verify \
            "oci://${{ steps.img.outputs.name }}@${{ steps.sbom.outputs.digest }}" \
            --repo "$GITHUB_REPOSITORY" --predicate-type https://cyclonedx.org/bom
